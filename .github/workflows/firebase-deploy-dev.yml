name: Deploy Develop to Firebase Hosting

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run local regression tests
        run: |
          node --test .tests/management-goals.frontend.test.mjs
          node --test worker.dev.js/worker.management-goals.test.mjs

      - name: Build Firebase Hosting artifact
        shell: pwsh
        run: ./scripts/build-hosting.ps1

      - name: Validate Firebase Hosting artifact
        run: node scripts/validate-hosting.mjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B2B_MEAL_PLAN_DEV }}
          projectId: b2b-meal-plan-dev
          channelId: live
