<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Meal Plan Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #f5f5f5; --bg-sidebar: #333333; --bg-card: #ffffff; --text-main: #333333; --border-soft: #cccccc; --border-light: #eeeeee; --primary: #4a90e2; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }
        
        .sidebar { width: 220px; background: var(--bg-sidebar); color: white; padding: 30px 20px; position: fixed; height: 100vh; z-index: 100; }
        .sidebar h2 { font-size: 18px; margin-bottom: 40px; }
        .nav-item { display: block; padding: 12px; color: #bbb; text-decoration: none; font-weight: 600; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: white !important; background: rgba(255, 255, 255, 0.15) !important; }

        .main-content { margin-left: 220px; width: calc(100% - 220px); padding: 40px; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--bg-card); border-radius: 12px; padding: 24px; border: 1px solid var(--border-light); margin-bottom: 20px; }

        .settings-grid { display: grid; grid-template-columns: 180px 120px 420px 320px; gap: 16px; align-items: end; }
        .settings-grid input[type="date"],
        .settings-grid select {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
        }
        .option-row { display: flex; flex-direction: row; gap: 12px; background: #fafafa; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-light); align-items: center; width: 100%; white-space : nowrap;}
        .option-row label { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; cursor: pointer; }

        .meal-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid var(--border-soft); background: #fff; }
        .meal-table th { background: #f9f9f9; padding: 10px; font-size: 13px; font-weight: 800; border: 1px solid var(--border-soft); color: #666; }
        .meal-table td { border: 1px solid var(--border-soft); vertical-align: top; }
        .week-label { background: #f5f5f5; font-weight: 800; width: 45px; text-align: center; vertical-align: middle !important; }
        .drop-zone { min-height: 180px; padding: 10px; cursor: pointer; transition: 0.2s; position: relative; }
        .drop-zone.selected { background: #eef6ff; box-shadow: inset 0 0 0 2px var(--primary); }

        .meal-content img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: transparent; border-radius: 0; margin-bottom: 6px; padding: 0; border: none; box-shadow: none; }
        .meal-title { font-weight: 800; font-size: 13px; line-height: 1.3; display: block; margin-bottom: 4px; }
        .extra-info { font-size: 11px; color: #666; display: none; margin-top: 2px; border-top: 1px dotted #ddd; padding-top: 2px; }
        .show-brand .info-brand, .show-price .info-price, .show-allergy .info-allergy, .show-memo .info-memo { display: block; }

        .editor-layout { display: flex; gap: 20px; align-items: flex-start; }
        .menu-lib { width: 320px; position: sticky; top: 20px; }
        .lib-search { margin-bottom: 15px; padding: 10px; border: 1.5px solid var(--border-soft); border-radius: 6px; width: 100%; font-size: 13px; }
        .lib-card { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 8px; cursor: pointer; background: #fff; transition: 0.2s; }

        .btn { padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; border: none; font-size: 13px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-grey { background: #e0e0e0; }
        .btn-red { padding: 4px 8px; background: #ff4d4f; color: white; font-size: 11px; border-radius: 4px; }

        .history-layout { display: flex; gap: 20px; height: calc(100vh - 150px); }
        .history-sidebar { width: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-detail { flex: 1; background: white; border-radius: 12px; border: 1px solid var(--border-light); padding: 24px; overflow-y: auto; }
        
        .history-card { padding: 15px; border: 1px solid var(--border-light); border-radius: 8px; background: white; cursor: pointer; position: relative; transition: 0.2s; }
        .history-card:hover { border-color: var(--primary); }
        .history-card.active { border-color: var(--primary); background: #f0f7ff; }
        .history-card b { display: block; font-size: 14px; margin-bottom: 4px; }
        .history-card span { font-size: 11px; color: #999; }
        .history-card .delete-btn { position: absolute; top: 10px; right: 10px; }

        /* 메뉴 관리 입력폼 수정 - 표 형식 최적화 */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; color: #666; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-soft); border-radius: 6px; font-size: 13px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 15px; }
        .form-row > div { flex: 1; }
    </style>
</head>
<body>

    <div id="login-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:none; align-items:center; justify-content:center; flex-direction:column;">
        <div style="text-align:center; padding:40px; border:1px solid #ddd; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); background:white;">
            <h2 style="color:#333; margin-bottom:25px; font-weight:800;">B2B영업팀 식단관리시스템</h2>
            <input type="text" id="login-id" placeholder="아이디" style="display:block; width:260px; margin:10px auto; padding:12px; border:1px solid #ddd; border-radius:6px;">
            <input type="password" id="login-pw" placeholder="비밀번호" style="display:block; width:260px; margin:10px auto; padding:12px; border:1px solid #ddd; border-radius:6px;">
            <button onclick="checkLogin()" style="width:260px; padding:12px; background:#333; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:700; margin-top:10px;">로그인</button>
        </div>
    </div>

    <aside class="sidebar">
        <h2>B2B 정기식 식단표</h2>
        <div class="nav-item active" id="nav-gen" onclick="showPage('page-generate')">📅 식단 생성</div>
        <div class="nav-item" id="nav-his" onclick="showPage('page-history')">📋 식단 관리</div>
        <div class="nav-item" id="nav-set" onclick="showPage('page-settings')">🍴 메뉴 관리</div>
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <div id="user-info" style="font-size: 13px; color: #fff; margin-bottom: 10px; font-weight: 600;">
                👤 <span id="current-user-name">로그인 필요</span>
            </div>
            <div class="nav-item" onclick="logout()" style="color: #ff4d4f !important; font-size: 13px;">
                🔓 로그아웃
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div id="page-generate" class="page active">
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:14px;">평균 식단가 <b id="stat-avg">0</b>원 | 총 메뉴 <b id="stat-total">0개</b> <span id="stat-unique" style="color:#999; font-size:12px; margin-left:5px;"></span></div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-save" onclick="savePlan()">💾 식단 저장</button>
                    <button class="btn btn-grey" onclick="saveAsPDF('pdf-area')">📄 PDF 출력</button>
                </div>
            </div>
            <section class="card">
                <div class="settings-grid">
                    <div>
                        <label style="font-size:11px; font-weight:800; display:block; margin-bottom:5px;">시작일</label>
                        <input type="date" id="start-date" onchange="validateMonday(this)">
                    </div>
            
                    <div>
                        <label style="font-size:11px; font-weight:800; display:block; margin-bottom:5px;">기간</label>
                        <select id="week-count" onchange="initGrid()">
                            <option value="1">1주일</option>
                            <option value="2">2주일</option>
                            <option value="3">3주일</option>
                            <option value="4" selected>4주일</option>
                        </select>
                    </div>
            
                    <div>
                        <label style="font-size:11px; font-weight:800; display:block; margin-bottom:5px;">요일 선택</label>
                        <div class="option-row">
                            <label><input type="checkbox" class="day-check" value="1" checked onchange="initGrid()"> 월</label>
                            <label><input type="checkbox" class="day-check" value="2" checked onchange="initGrid()"> 화</label>
                            <label><input type="checkbox" class="day-check" value="3" checked onchange="initGrid()"> 수</label>
                            <label><input type="checkbox" class="day-check" value="4" checked onchange="initGrid()"> 목</label>
                            <label><input type="checkbox" class="day-check" value="5" checked onchange="initGrid()"> 금</label>
                            <label><input type="checkbox" class="day-check" value="6" onchange="initGrid()"> 토</label>
                            <label><input type="checkbox" class="day-check" value="0" onchange="initGrid()"> 일</label>
                        </div>
                    </div>
            
                    <div>
                        <label style="font-size:11px; font-weight:800; display:block; margin-bottom:5px;">노출 정보 설정</label>
                        <div class="option-row">
                            <label><input type="checkbox" onchange="toggleInfo('show-brand', this)"> 브랜드</label>
                            <label><input type="checkbox" onchange="toggleInfo('show-price', this)"> 가격</label>
                            <label><input type="checkbox" onchange="toggleInfo('show-allergy', this)"> 알러지</label>
                            <label><input type="checkbox" onchange="toggleInfo('show-memo', this)"> 메모</label>
                        </div>
                    </div>
                </div>
            </section>
            <div class="editor-layout">
                <div style="flex:1;" id="pdf-area"><div id="grid-container"></div></div>
                <div class="menu-lib">
                    <div class="card">
                        <h4 style="margin-bottom:12px; font-size:14px;">메뉴 라이브러리</h4>
                        <input type="text" class="lib-search" placeholder="메뉴 검색..." onkeyup="renderLib(this.value)">
                        <div id="lib-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-history" class="page">
            <header style="margin-bottom:20px;"><h1>저장된 식단 이력</h1></header>
            <div class="history-layout">
                <div id="history-sidebar" class="history-sidebar"></div>
                <div id="history-detail" class="history-detail">
                    <p style="color:#ccc; text-align:center; margin-top:100px;">이력을 선택하면 상세 내용을 볼 수 있습니다.</p>
                </div>
            </div>
        </div>

        <div id="page-settings" class="page">
            <header style="margin-bottom:20px;"><h1>메뉴 데이터베이스 관리</h1></header>
            <div style="display:flex; gap:20px;">
                <div style="flex:1" class="card">
                    <input type="text" id="mgmt-search" placeholder="메뉴 검색..." onkeyup="renderMgmt()" style="margin-bottom:15px; padding:10px; border:1px solid #ccc; border-radius:6px; width:200px;">
                    <table style="width:100%; border-collapse:collapse; font-size:14px;">
                        <thead style="border-bottom:2px solid #333; text-align:left;">
                            <tr>
                                <th style="padding:12px 10px;">사진</th>
                                <th>메뉴명</th>
                                <th>브랜드</th>
                                <th>가격</th>
                                <th style="text-align:center;">관리</th>
                            </tr>
                        </thead>
                        <tbody id="mgmt-list"></tbody>
                    </table>
                </div>
                
                <div style="width:380px" class="card">
                    <h4 style="margin-bottom:20px; font-size:16px; border-bottom:1px solid #eee; padding-bottom:10px;">메뉴 등록/수정</h4>
                    
                    <div id="preview-box" style="width:100%; aspect-ratio:16/9; background:#f9f9f9; border:1px dashed #ccc; margin-bottom:20px; border-radius:8px; overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="document.getElementById('file-input').click()">
                        <span id="preview-text" style="color:#999; font-size:13px;">📷 이미지 등록</span>
                        <img id="edit-preview" style="display:none; width:100%; height:100%; object-fit:cover;">
                    </div>
                    <input type="file" id="file-input" style="display:none" onchange="processImg(event)">
                    <input type="hidden" id="edit-id"><input type="hidden" id="edit-img-base64">

                    <div class="form-group">
                        <label>메뉴명</label>
                        <input type="text" id="edit-name" placeholder="메뉴 이름을 입력하세요">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>브랜드</label>
                            <input type="text" id="edit-brand" placeholder="브랜드명">
                        </div>
                        <div class="form-group">
                            <label>가격 (원)</label>
                            <input type="number" id="edit-price" placeholder="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>알러지 정보</label>
                        <input type="text" id="edit-allergy" placeholder="예: 대두, 밀, 우유">
                    </div>

                    <div class="form-group">
                        <label>메모</label>
                        <textarea id="edit-memo" rows="3" placeholder="특이사항 입력"></textarea>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn btn-save" style="flex:2;" onclick="saveMenu()">메뉴 데이터 저장</button>
                        <button class="btn btn-grey" style="flex:1;" onclick="resetMenuForm()">초기화</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

        function escapeHtml(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

                .map(el => parseInt(el.value, 10));

            return checked.length > 0 ? checked : [1, 2, 3, 4, 5];
        }

        async function apiGet(path = '') {
            const response = await fetch(`${API_URL}${path}`);
            if (!response.ok) throw new Error(`GET 실패: ${response.status}`);
            return response.json();
        }
        
        async function apiPost(path = '', body = {}) {
            const response = await fetch(`${API_URL}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) throw new Error(`POST 실패: ${response.status}`);
            return response.json().catch(() => ({}));
        }
        
        async function apiDelete(path = '') {
            const response = await fetch(`${API_URL}${path}`, {
                method: 'DELETE'
            });
            if (!response.ok) throw new Error(`DELETE 실패: ${response.status}`);
            return response.json().catch(() => ({}));
        }

        // =========================
        // 식단 그리드
        // =========================
        function initGrid() {
            const startStr = document.getElementById('start-date').value;
            const weeks = parseInt(document.getElementById('week-count').value, 10);
            const selectedDays = getSelectedDays();
            const container = document.getElementById('grid-container');

            // 선택된 요일이 없으면 안내
            if (!selectedDays.length) {
                container.innerHTML = `<p style="color:#999; text-align:center; padding:40px;">요일을 1개 이상 선택해주세요.</p>`;
                updateStats();
                return;
            }

            let html = `
                <table class="meal-table">
                    <thead>
                        <tr>
                            <th></th>
                            ${selectedDays.map(day => `<th>${DAY_LABELS[day]}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (let w = 0; w < weeks; w++) {
                html += `<tr><td class="week-label">${w + 1}주</td>`;

                selectedDays.forEach(day => {
                    const cid = `cell-${w}-${day}`;
                    let dateLabel = "";

                    if (startStr) {
                        const startDate = new Date(startStr);
                        const monday = new Date(startDate);
                        monday.setDate(startDate.getDate() + (w * 7));

                        const cellDate = new Date(monday);
                        const offset = day === 0 ? 6 : day - 1; // 월=0, 화=1 ... 일=6
                        cellDate.setDate(monday.getDate() + offset);

                        dateLabel = `${cellDate.getMonth() + 1}/${cellDate.getDate()}`;
                    }

                    html += `
                        <td onclick="selectCell('${cid}')">
                            <div id="${cid}" class="drop-zone ${currentCellId === cid ? 'selected' : ''}">
                                <span class="cell-date" style="font-size:10px; color:#999; margin-bottom:4px; display:block;">${dateLabel}</span>
                                <div class="cell-content">${mealPlan[cid] ? renderCell(mealPlan[cid]) : ''}</div>
                            </div>
                        </td>
                    `;
                });

                html += `</tr>`;
            }

            html += `</tbody></table>`;
            container.innerHTML = html;

            // 현재 선택 셀이 안 보이는 요일이면 첫 번째 셀 선택
            if (!document.getElementById(currentCellId)) {
                currentCellId = `cell-0-${selectedDays[0]}`;
                if (document.getElementById(currentCellId)) {
                    document.getElementById(currentCellId).classList.add('selected');
                }
            }

            updateStats();
        }
        
        function selectCell(id) {
            if (document.getElementById(currentCellId)) {
                document.getElementById(currentCellId).classList.remove('selected');
            }
            currentCellId = id;
            if (document.getElementById(id)) {
                document.getElementById(id).classList.add('selected');
            }
        }
        
        function addToGrid(mid) {
            const menu = menus.find(m => String(m.id) === String(mid));
            if (!menu) return;

            mealPlan[currentCellId] = { ...menu };

            const targetCell = document.getElementById(currentCellId);
            if (targetCell) {
                const content = targetCell.querySelector('.cell-content');
                if (content) content.innerHTML = renderCell(menu);
            }

            updateStats();

            const selectedDays = getSelectedDays();
            const parts = currentCellId.split('-');
            let w = parseInt(parts[1], 10);
            let day = parseInt(parts[2], 10);

            const currentIndex = selectedDays.indexOf(day);

            if (currentIndex === -1) {
                // 현재 day가 선택 목록에 없으면 첫 번째로
                selectCell(`cell-${w}-${selectedDays[0]}`);
                return;
            }

            let nextIndex = currentIndex + 1;

            if (nextIndex >= selectedDays.length) {
                nextIndex = 0;
                w += 1;
            }

            if (w < parseInt(document.getElementById('week-count').value, 10)) {
                selectCell(`cell-${w}-${selectedDays[nextIndex]}`);
            }
        }
                
        function renderCell(m) {
            return `
                <div class="meal-content">
                    <img src="${escapeHtml(getDefaultImage(m.img || m.image || ''))}">
                    <span class="meal-title">${escapeHtml(m.name || '')}</span>
                    <div class="extra-info info-brand">🏢 ${escapeHtml(m.brand || '')}</div>
                    <div class="extra-info info-price">💰 ${(m.price || 0).toLocaleString()}원</div>
                    <div class="extra-info info-allergy">⚠️ ${escapeHtml(m.allergy || '')}</div>
                    <div class="extra-info info-memo">📝 ${escapeHtml(m.memo || '')}</div>
                </div>
            `;
        }
        
        function updateStats() {
            const meals = Object.values(mealPlan);
            const names = meals.map(m => m.name);
            const uniqueCount = new Set(names).size;
            const avg = meals.length > 0
                ? Math.round(meals.reduce((s, m) => s + (m.price || 0), 0) / meals.length)
                : 0;
        
            document.getElementById('stat-avg').innerText = avg.toLocaleString();
            document.getElementById('stat-total').innerText = meals.length + "개";
            document.getElementById('stat-unique').innerText = meals.length > 0 ? `(중복 제외 ${uniqueCount}종)` : "";
        }

        function renderStaticGrid(plan) {
            const selectedDays = Array.isArray(plan.selectedDays) && plan.selectedDays.length
                ? plan.selectedDays
                : [1, 2, 3, 4, 5];

            let html = `
                <table class="meal-table">
                    <thead>
                        <tr>
                            <th></th>
                            ${selectedDays.map(day => `<th>${DAY_LABELS[day]}</th>`).join('')}
                        </tr>

            `;

            const weeks = parseInt(plan.weeks || 1, 10);

            for (let w = 0; w < weeks; w++) {
                html += `<tr><td class="week-label">${w + 1}주</td>`;

                selectedDays.forEach(day => {
                    const cid = `cell-${w}-${day}`;
                    const m = plan.data?.[cid];
                    html += `<td>${m ? renderCell(m) : ''}</td>`;
                });

                html += `</tr>`;
            }

            html += `</tbody></table>`;
            return html;

            if (!obj.name) return alert("메뉴명을 입력해주세요.");

            try {
                // 서버에 단건 저장
                await saveMenuItemToServer(obj);

                // 화면용 로컬 메모리 menus도 갱신
                const idx = menus.findIndex(m => String(m.id) === String(obj.id));
                if (idx > -1) {
                    menus[idx] = obj;
                } else {
                    menus.push(obj);
                }

                alert("저장되었습니다.");
                resetMenuForm();
                renderMgmt();
                renderLib();
            } catch (e) {
                console.error(e);
                alert("클라우드 저장에 실패했습니다.");
            }
        }
        
        function editMenu(id) {
            const m = menus.find(x => String(x.id) === String(id));
            if (!m) return;
        
            document.getElementById('edit-id').value = m.id;
            document.getElementById('edit-name').value = m.name || '';
            document.getElementById('edit-brand').value = m.brand || '';
            document.getElementById('edit-price').value = m.price || '';
            document.getElementById('edit-allergy').value = m.allergy || '';
            document.getElementById('edit-memo').value = m.memo || '';
            document.getElementById('edit-img-base64').value = m.img || '';
        
            if (m.img) {
                document.getElementById('edit-preview').src = m.img;
                document.getElementById('edit-preview').style.display = 'block';
                document.getElementById('preview-text').style.display = 'none';
            } else {
                document.getElementById('edit-preview').style.display = 'none';
                document.getElementById('preview-text').style.display = 'block';
            }
        
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function resetMenuForm() {
            document.getElementById('edit-id').value = "";
            document.getElementById('edit-name').value = "";
            document.getElementById('edit-brand').value = "";
            document.getElementById('edit-price').value = "";
            document.getElementById('edit-allergy').value = "";
            document.getElementById('edit-memo').value = "";
            document.getElementById('edit-img-base64').value = "";
            document.getElementById('edit-preview').style.display = 'none';
            document.getElementById('edit-preview').src = '';
            document.getElementById('preview-text').style.display = 'block';
        }
        
        function processImg(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');

                    const MAX_WIDTH = 120; // 180 -> 120
                    const scaleSize = Math.min(1, MAX_WIDTH / img.width);

                    canvas.width = Math.round(img.width * scaleSize);
                    canvas.height = Math.round(img.height * scaleSize);

                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    const compressedData = canvas.toDataURL('image/png');

                    document.getElementById('edit-img-base64').value = compressedData;
                    document.getElementById('edit-preview').src = compressedData;
                    document.getElementById('edit-preview').style.display = 'block';
                    document.getElementById('preview-text').style.display = 'none';
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // =========================
        // PDF
        // =========================
        async function saveAsPDF(id) {
            const canvas = await html2canvas(document.getElementById(id), { scale: 2 });
            const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
            const w = pdf.internal.pageSize.getWidth();
            const h = (canvas.height * w) / canvas.width;
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 10, w, h);
            pdf.save(`식단_${new Date().getTime()}.pdf`);
        }
        
        // =========================
        // 초기 실행
        // =========================
        window.addEventListener('load', async () => {
            const authed = initAuth();
            if (!authed) return;
        
            // 예전 식단 캐시 제거
             localStorage.removeItem('b2b_plans_cache');
             localStorage.removeItem('b2b_menus_cache');

            initGrid();
            await loadMenusFromServer();
        
            // 식단 이력 미리 불러오기
            await loadPlansFromServer();
        });
        </script>
