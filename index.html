<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Meal Plan Pro - Team Leader Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7fe;
            --sidebar-color: #1a202c;
            --card-bg: #ffffff;
            --primary: #4318ff;
            --primary-hover: #3311db;
            --text-main: #2b3674;
            --text-muted: #a3aed0;
            --border-color: #e0e5f2;
            --danger: #ff5c5c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

        /* 레이아웃 */
        .sidebar { width: 240px; background: var(--sidebar-color); color: white; padding: 30px 20px; position: fixed; height: 100vh; z-index: 100; }
        .sidebar-header h2 { font-size: 20px; margin-bottom: 40px; }
        .nav-item { display: block; padding: 15px; color: var(--text-muted); text-decoration: none; font-weight: 600; border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
        .nav-item.active { color: white; background: rgba(255, 255, 255, 0.1); }
        .main-content { margin-left: 240px; width: calc(100% - 240px); padding: 30px; }
        .page { display: none; }
        .page.active { display: block; }

        .card { background: var(--card-bg); border-radius: 20px; padding: 24px; box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.08); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

        /* 버튼 및 폼 */
        .btn { padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 10px; }

        /* --- 식단 생성 스타일 --- */
        .gen-controls { display: grid; grid-template-columns: 1.5fr 1fr 2fr; gap: 20px; align-items: end; margin-bottom: 20px; }
        .option-group { display: flex; gap: 12px; background: #f8faff; padding: 10px; border-radius: 12px; border: 1px solid var(--border-color); }
        .option-group label { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .meal-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--border-color); border-radius: 15px; overflow: hidden; table-layout: fixed; }
        .meal-table th { background: #f8f9fa; padding: 12px; font-size: 13px; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .meal-table td { border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); vertical-align: top; }
        .week-label { background: #f1f4ff; font-weight: 700; color: var(--primary); text-align: center; width: 60px; vertical-align: middle !important; }

        .drop-zone { min-height: 180px; padding: 10px; cursor: pointer; }
        .drop-zone.selected { background: #f0f3ff; box-shadow: inset 0 0 0 2px var(--primary); }
        .cell-date { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; display: block; }
        
        .meal-content img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
        .meal-name-label { font-weight: 700; font-size: 14px; margin-bottom: 4px; display: block; }
        
        .extra-info { font-size: 11px; color: #666; display: none; margin-top: 2px; border-top: 1px dashed #eee; padding-top: 2px; }
        .show-brand .info-brand, .show-price .info-price, .show-allergy .info-allergy { display: block; }

        /* --- 메뉴 설정 스타일 --- */
        .settings-container { display: flex; gap: 24px; }
        .menu-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .upload-area { width: 100%; height: 150px; border: 2px dashed var(--border-color); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; background: #fafbff; margin-bottom: 15px; }
        .upload-area img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #file-input { display: none; }

        .editor-layout { display: flex; gap: 20px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header"><h2>B2B Meal</h2></div>
        <nav>
            <div class="nav-item active" id="nav-gen" onclick="showPage('page-generate')">📅 식단 생성</div>
            <div class="nav-item" id="nav-set" onclick="showPage('page-settings')">🍴 메뉴 설정</div>
        </nav>
    </aside>

    <main class="main-content">
        <div id="page-generate" class="page active">
            <header style="margin-bottom: 20px;"><h1>식단 생성 대시보드</h1></header>
            
            <section class="card">
                <div class="gen-controls">
                    <div>
                        <label style="font-size:12px; font-weight:700;">시작 날짜 (월요일)</label>
                        <input type="date" id="start-date" onchange="validateAndGenerate(this)">
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:700;">주차 선택</label>
                        <select id="week-count" onchange="renderMealGrid()">
                            <option value="1">1주일</option><option value="2">2주일</option>
                            <option value="3">3주일</option><option value="4" selected>4주일</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:700;">노출 정보 설정</label>
                        <div class="option-group">
                            <label><input type="checkbox" onchange="toggleDisplay('show-brand', this)"> 브랜드</label>
                            <label><input type="checkbox" onchange="toggleDisplay('show-price', this)"> 가격</label>
                            <label><input type="checkbox" onchange="toggleDisplay('show-allergy', this)"> 알러지</label>
                        </div>
                    </div>
                </div>
            </section>

            <div class="editor-layout">
                <div style="flex:1">
                    <div id="meal-grid-container"></div>
                </div>
                <div style="width:280px">
                    <section class="card" id="lib-list-container" style="max-height: 80vh; overflow-y: auto;">
                        <h3 class="section-title" style="font-size:15px;">라이브러리</h3>
                        <div id="lib-list"></div>
                    </section>
                </div>
            </div>
        </div>

        <div id="page-settings" class="page">
            <header style="margin-bottom: 20px;"><h1>메뉴 관리</h1></header>
            <div class="settings-container">
                <div style="flex:1">
                    <section class="card">
                        <input type="text" class="search-box" style="margin-bottom:15px;" placeholder="메뉴 검색..." onkeyup="renderSettingsTable()">
                        <table style="width:100%; border-collapse:collapse;" id="settings-table">
                            <thead style="text-align:left; font-size:13px; color:var(--text-muted);">
                                <tr><th>이미지</th><th>메뉴명</th><th>가격</th><th>관리</th></tr>
                            </thead>
                            <tbody id="settings-menu-list"></tbody>
                        </table>
                    </section>
                </div>
                <div style="width:380px;">
                    <section class="card">
                        <div class="section-title" id="form-title">신규 메뉴 등록</div>
                        <div class="upload-area" onclick="document.getElementById('file-input').click()">
                            <div id="upload-msg" style="text-align:center; font-size:12px; color:var(--text-muted);">
                                <b>📷 사진 업로드</b><br>5MB 제한 (자동 압축)
                            </div>
                            <img id="img-preview">
                        </div>
                        <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">
                        <input type="hidden" id="edit-id"><input type="hidden" id="in-img-data">
                        
                        <div style="display:grid; gap:10px;">
                            <input type="text" id="in-name" placeholder="메뉴명">
                            <input type="text" id="in-brand" placeholder="브랜드">
                            <input type="number" id="in-price" placeholder="가격">
                            <input type="text" id="in-allergy" placeholder="알러지 정보">
                            <textarea id="in-memo" placeholder="메모" rows="2"></textarea>
                            <button class="btn btn-primary" onclick="saveMenu()">저장하기</button>
                            <button class="btn btn-outline" onclick="resetForm()">취소</button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script>
        let menus = [
    { id: 1, name: "바싹불고기 반상", brand: "본도시락", price: 9400, allergy: "대두, 밀, 쇠고기, 돼지고기, 우유", memo: "안매움", img: "" },
    { id: 2, name: "숯불닭구이 반상", brand: "본도시락", price: 9400, allergy: "대두, 밀, 쇠고기, 닭고기, 우유", memo: "", img: "" },
    { id: 3, name: "깻잎제육 반상", brand: "본도시락", price: 10000, allergy: "대두, 밀, 돼지고기", memo: "약간매움", img: "" },
    { id: 4, name: "버섯소불고기 반상", brand: "본도시락", price: 10400, allergy: "대두, 밀, 쇠고기, 토마토", memo: "", img: "" },
    { id: 5, name: "꽈리닭구이 반상", brand: "본도시락", price: 10200, allergy: "대두, 밀, 쇠고기, 닭고기, 우유", memo: "", img: "" },
    { id: 6, name: "부추마늘오리구이 반상", brand: "본도시락", price: 10400, allergy: "대두, 밀, 쇠고기, 우유", memo: "", img: "" },
    { id: 7, name: "전주 콩나물국밥", brand: "본설렁탕", price: 9000, allergy: "오징어, 새우, 대두, 밀, 조개류, 바지락, 굴, 쇠고기, 우유, 계란", memo: "", img: "" },
    { id: 8, name: "한우사골 설렁탕", brand: "본설렁탕", price: 12000, allergy: "대두, 밀, 쇠고기, 닭고기, 우유, 새우, 오징어, 굴, 조개류", memo: "", img: "" },
    { id: 9, name: "쇠고기야채죽", brand: "본죽&비빔밥", price: 12000, allergy: "대두, 밀, 쇠고기, 우유", memo: "", img: "" },
    { id: 10, name: "6가지나물비빔밥", brand: "본죽&비빔밥", price: 10500, allergy: "대두, 밀, 쇠고기, 우유, 계란", memo: "", img: "" } 
        ]; 
        let mealData = {}; 
        let selectedCellId = null;

        // --- 공통: 페이지 전환 ---
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'page-generate') {
                document.getElementById('nav-gen').classList.add('active');
                renderLibrary();
                renderMealGrid();
            } else {
                document.getElementById('nav-set').classList.add('active');
                renderSettingsTable();
            }
        }

        // --- 메뉴 설정: 이미지 업로드 & 압축 ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) return alert("5MB 이하만 가능합니다.");

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let w = img.width, h = img.height;
                    if (w > MAX_WIDTH) { h *= MAX_WIDTH / w; w = MAX_WIDTH; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    const compressed = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('in-img-data').value = compressed;
                    document.getElementById('img-preview').src = compressed;
                    document.getElementById('img-preview').style.display = 'block';
                    document.getElementById('upload-msg').style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        }

        function saveMenu() {
            const id = document.getElementById('edit-id').value;
            const menuObj = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('in-name').value,
                brand: document.getElementById('in-brand').value,
                price: parseInt(document.getElementById('in-price').value) || 0,
                img: document.getElementById('in-img-data').value,
                allergy: document.getElementById('in-allergy').value,
                memo: document.getElementById('in-memo').value
            };
            if(!menuObj.name || !menuObj.img) return alert("이름과 사진은 필수입니다.");
            
            if(id) menus[menus.findIndex(m => m.id === parseInt(id))] = menuObj;
            else menus.push(menuObj);

            resetForm(); renderSettingsTable(); alert("저장 완료!");
        }

        function renderSettingsTable() {
            const list = document.getElementById('settings-menu-list');
            list.innerHTML = menus.map(m => `
                <tr style="border-bottom:1px solid #eee; cursor:pointer;" onclick="loadMenu(${m.id})">
                    <td style="padding:10px;"><img src="${m.img}" class="menu-thumb"></td>
                    <td><b>${m.name}</b></td>
                    <td>${m.price.toLocaleString()}원</td>
                    <td><button onclick="event.stopPropagation(); deleteMenu(${m.id})">❌</button></td>
                </tr>
            `).join('');
        }

        function loadMenu(id) {
            const m = menus.find(x => x.id === id);
            document.getElementById('edit-id').value = m.id;
            document.getElementById('in-name').value = m.name;
            document.getElementById('in-brand').value = m.brand;
            document.getElementById('in-price').value = m.price;
            document.getElementById('in-img-data').value = m.img;
            document.getElementById('img-preview').src = m.img;
            document.getElementById('img-preview').style.display = 'block';
            document.getElementById('upload-msg').style.display = 'none';
        }

        function resetForm() {
            document.getElementById('edit-id').value = "";
            document.querySelectorAll('#page-settings input, #page-settings textarea').forEach(i => i.value="");
            document.getElementById('img-preview').style.display = 'none';
            document.getElementById('upload-msg').style.display = 'block';
        }

        function deleteMenu(id) {
            if(confirm("삭제할까요?")) { menus = menus.filter(m => m.id !== id); renderSettingsTable(); }
        }

        // --- 식단 생성: 날짜 로직 & 그리드 ---
        function validateAndGenerate(input) {
            const date = new Date(input.value);
            if(date.getDay() !== 1) {
                alert("식단표는 '월요일'부터 시작해야 합니다.");
                input.value = ""; return;
            }
            renderMealGrid();
        }

        function toggleDisplay(cls, cb) {
            const container = document.getElementById('meal-grid-container');
            cb.checked ? container.classList.add(cls) : container.classList.remove(cls);
        }

        function renderMealGrid() {
            const weeks = document.getElementById('week-count').value;
            const startStr = document.getElementById('start-date').value;
            const container = document.getElementById('meal-grid-container');
            
            let html = `<table class="meal-table"><thead><tr><th>주차</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead><tbody>`;
            
            for(let w=0; w<weeks; w++) {
                html += `<tr><td class="week-label">${w+1}주</td>`;
                for(let d=0; d<5; d++) {
                    const cid = `cell-${w}-${d}`;
                    let dateInfo = "날짜 미정";
                    if(startStr) {
                        let dt = new Date(startStr);
                        dt.setDate(dt.getDate() + (w*7) + d);
                        dateInfo = `${dt.getMonth()+1}/${dt.getDate()} (${['일','월','화','수','목','금','토'][dt.getDay()]})`;
                    }
                    html += `<td onclick="selectCell('${cid}')">
                        <div id="${cid}" class="drop-zone">
                            <span class="cell-date">${dateInfo}</span>
                            <div class="meal-content">${mealData[cid] ? renderCellContent(mealData[cid]) : ''}</div>
                        </div>
                    </td>`;
                }
                html += `</tr>`;
            }
            container.innerHTML = html + `</tbody></table>`;
        }

        function renderCellContent(m) {
            return `
                <img src="${m.img}">
                <span class="meal-name-label">${m.name}</span>
                <div class="extra-info info-brand">🏢 ${m.brand}</div>
                <div class="extra-info info-price">💰 ${m.price.toLocaleString()}원</div>
                <div class="extra-info info-allergy">⚠️ ${m.allergy}</div>
            `;
        }

        function selectCell(id) {
            if(selectedCellId) document.getElementById(selectedCellId).classList.remove('selected');
            selectedCellId = id;
            document.getElementById(id).classList.add('selected');
        }

        function renderLibrary() {
            const lib = document.getElementById('lib-list');
            lib.innerHTML = menus.map(m => `
                <div class="card" style="padding:10px; margin-bottom:10px; cursor:pointer; display:flex; gap:10px;" onclick="addMenuToGrid(${m.id})">
                    <img src="${m.img}" style="width:45px; height:45px; object-fit:cover; border-radius:6px;">
                    <div><div style="font-weight:700; font-size:13px;">${m.name}</div><div style="font-size:11px; color:#999;">${m.price.toLocaleString()}원</div></div>
                </div>
            `).join('');
        }

        function addMenuToGrid(mid) {
            if(!selectedCellId) return alert("날짜 칸을 먼저 선택하세요.");
            const menu = menus.find(m => m.id === mid);
            mealData[selectedCellId] = menu;
            document.getElementById(selectedCellId).querySelector('.meal-content').innerHTML = renderCellContent(menu);
            
            // 자동 다음 칸 이동
            const p = selectedCellId.split('-');
            let w = parseInt(p[1]), d = parseInt(p[2]);
            d++; if(d > 4) { d = 0; w++; }
            const next = `cell-${w}-${d}`;
            if(document.getElementById(next)) selectCell(next);
        }

        window.onload = () => { renderMealGrid(); renderLibrary(); };
    </script>
</body>
</html>
